[versions]
# libraries
# https://search.maven.org/artifact/com.jetbrains.rd/rd-gen
# Must stay compatible with the RD runtime and Rider model bundled in the target IDE.
rdGen = "2026.2.5"
# Test runtime dependency; verify updates against the bundled IDE test framework.
junit = "4.13.2"
# Assertion API used by JUnit and the bundled IDE test framework; verify compatibility when updating.
opentest4j = "1.3.0"
# Keep Jupiter API, params and engine on the same release; verify bundled IDE test framework compatibility.
junitJupiter = "6.1.3"
# Keep on the same release as junitJupiter; verify bundled IDE test framework compatibility.
junitPlatform = "6.1.3"
# The IDE supplies the runtime; compile APIs and generated Java stubs must remain compatible with it.
grpc = "1.73.0"
# The IDE supplies the runtime; compile APIs and generated Kotlin stubs must remain compatible with it.
grpcKotlin = "1.4.3"
# The IDE supplies the runtime; compile APIs and protoc output must remain compatible with it.
protobuf = "3.25.5"
javaxAnnotationApi = "1.3.2"
# The IDE supplies the runtime; compile against serialization APIs available in the target IDE.
serialization = "1.9.0"
# Shipped server modules use the IDE's Ktor runtime; keep versions aligned to avoid ABI mismatches.
ktor = "3.4.1"
# Shipped transport classes use the IDE's Netty runtime; keep versions aligned to avoid ABI mismatches.
netty = "4.2.16.Final"
# Keep aligned with the IDE's coroutines-core; the test library's own core dependency is excluded.
coroutineTest = "1.10.2"

# plugins
kotlin = "2.4.20"
changelog = "2.5.0"
protobufPlugin = "0.9.6"

[libraries]
rdGen = { group = "com.jetbrains.rd", name = "rd-gen", version.ref = "rdGen" }
kotlinStdLib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
serializationJson = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junitJupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junitJupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutineTest" }
grpc-protobuf = { group = "io.grpc", name = "grpc-protobuf", version.ref = "grpc" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { group = "io.grpc", name = "grpc-kotlin-stub", version.ref = "grpcKotlin" }
grpc-netty-shaded = { group = "io.grpc", name = "grpc-netty-shaded", version.ref = "grpc" }
protobuf-java = { group = "com.google.protobuf", name = "protobuf-java", version.ref = "protobuf" }
protobuf-kotlin = { group = "com.google.protobuf", name = "protobuf-kotlin", version.ref = "protobuf" }
javaxAnnotationApi = { group = "javax.annotation", name = "javax.annotation-api", version.ref = "javaxAnnotationApi" }
# Ktor server plugins not present in the platform's bundled Ktor modules.
# The core content module class loader reads its own jar only, so these jars merge into
# lib/modules/intellij.aspire.core.jar. They do not ship in lib/. See core/build.gradle.kts.
# Merged non-transitively; all transitive Ktor pieces (server-core, http, io, utils,
# serialization, websocket codec) are provided by the bundled intellij.libraries.ktor.* modules.
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
# Ktor's Netty engine references io.netty.channel.epoll.Epoll and io.netty.channel.kqueue.KQueue
# unconditionally to pick an event loop, and the IDE does not expose those transports as bundled
# modules. Only the pure-Java "classes" artifacts are shipped, without the native binaries, so
# isAvailable() answers false and the engine falls back to NIO.
netty-transport-classes-epoll = { group = "io.netty", name = "netty-transport-classes-epoll", version.ref = "netty" }
netty-transport-classes-kqueue = { group = "io.netty", name = "netty-transport-classes-kqueue", version.ref = "netty" }

[plugins]
intelliJPlatform = { id = "org.jetbrains.intellij.platform" }
intelliJPlatformModule = { id = "org.jetbrains.intellij.platform.module" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
