# Dependabot configuration:
# https://docs.github.com/en/free-pro-team@latest/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Maintain dependencies for Gradle dependencies
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      junit:
        patterns:
          - "junit:junit"
          - "org.junit*"
          - "org.opentest4j*"
    ignore:
      # Update IDE-provided runtimes and their companion modules/generators with the target SDK.
      # This avoids compiling or generating calls to APIs unavailable at runtime (see gradle/libs.versions.toml).
      - dependency-name: "io.grpc*"
      - dependency-name: "com.google.protobuf:protobuf-*"
      - dependency-name: "com.google.protobuf:protoc"
      - dependency-name: "io.ktor*"
      - dependency-name: "io.netty*"
      - dependency-name: "org.jetbrains.kotlinx*"
      - dependency-name: "com.jetbrains.rd*"
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
